name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Check video link (Drive)
        continue-on-error: true
        run: |
          curl -sSL -r 0-1023 -o /dev/null -D - "https://drive.usercontent.google.com/download?id=1ybRoIH3urtYi1EzVrCC2sxs_ZGWmVU6g&export=download&confirm=t" | grep -iE "^HTTP|content-type|content-range|content-length"
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TvLoopPlayer-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
